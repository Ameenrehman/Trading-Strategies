name: Deep Strategy Backtest & Analysis

# Only run manually on demand via GitHub Actions UI ("Run workflow" button)
on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Strategy script to run'
        required: true
        default: 'backtest/nextday/feasibility.py'
        type: choice
        options:
          - backtest/nextday/feasibility.py
          - backtest/costs.py
          - data/corporate_actions.py
      commit_results:
        description: 'Automatically commit and push results back to this branch'
        required: true
        default: true
        type: boolean

jobs:
  run-backtest-matrix:
    name: Run Next-Day Feasibility Study
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Runner Hardware & Environment
        run: |
          echo "=================================================="
          echo "GITHUB RUNNER HARDWARE & SYSTEM SPECS"
          echo "=================================================="
          echo "--- OS / Kernel Info ---"
          uname -a
          cat /etc/os-release | grep -E 'PRETTY_NAME|VERSION'
          echo ""
          echo "--- CPU Configuration ---"
          echo "Total CPU Cores: $(nproc)"
          lscpu | grep -E 'Model name|Architecture|CPU\(s\)|Thread\(s\) per core|CPU MHz'
          echo ""
          echo "--- Memory (RAM) ---"
          free -h
          echo ""
          echo "--- Storage / Disk Space ---"
          df -h /
          echo ""
          echo "--- GPU Status (if available) ---"
          if command -v nvidia-smi &> /dev/null; then
            nvidia-smi
          else
            echo "No dedicated NVIDIA GPU detected on this runner."
          fi
          echo "=================================================="

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas

      - name: Execute Strategy Backtest & Monte Carlo
        run: |
          python ${{ inputs.strategy || 'backtest/nextday/feasibility.py' }}

      - name: Archive Backtest Results & Charts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-artifacts-${{ github.sha }}
          path: |
            backtest/results/nextday/
          retention-days: 30

      - name: Commit & Push Results to Branch
        if: ${{ inputs.commit_results != false }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest in case of any concurrent changes
          git pull --rebase origin ${{ github.ref_name }}
          
          # Stage result files
          git add backtest/results/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "chore(backtest): Automated results update [skip ci]"
            git push origin ${{ github.ref_name }}
            echo "Results committed and pushed to branch ${{ github.ref_name }} successfully."
          fi
